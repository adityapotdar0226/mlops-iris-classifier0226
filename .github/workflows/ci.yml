
name: Iris Classifier CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    name: Build and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint source code
        run: |
          flake8 src tests --max-line-length=120

      - name: Check Python syntax
        run: |
          python -m compileall -q src tests

  test-suite:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build-and-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Prepare pipeline data
        run: |
          python src/pipeline/collect.py --output data/raw/iris_raw.csv
          python src/pipeline/preprocess.py --input data/raw/iris_raw.csv --output data/processed/iris_clean.csv
          python src/pipeline/features.py --input data/processed/iris_clean.csv --output data/processed/iris_features.csv
          python src/pipeline/validate.py --input data/processed/iris_features.csv

      - name: Run pytest
        run: |
          pytest --cov=src.pipeline --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=test-results.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            test-results.xml
            coverage.xml

   model-quality-gate:
    runs-on: ubuntu-latest
    needs: test-suite

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Prepare data for model quality tests
        run: |
          python src/pipeline/collect.py --output data/raw/iris_raw.csv
          python src/pipeline/preprocess.py --input data/raw/iris_raw.csv --output data/processed/iris_clean.csv
          python src/pipeline/features.py --input data/processed/iris_clean.csv --output data/processed/iris_features.csv
          python src/pipeline/validate.py --input data/processed/iris_features.csv

      - name: Run model quality tests
        run: pytest tests/test_model_quality.py
